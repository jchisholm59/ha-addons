name: ADS-B Monitor
version: "1.11.1"
slug: adsb_monitor
description: "Your PiAware / dump1090-fa receiver as a dashboard (map, flights, coverage, 3D cockpit with HUD) and phone alerts."
url: https://github.com/jchisholm59/adsb-monitor
arch:
  - aarch64
  - amd64
  - armv7
init: true
startup: application
boot: auto
ingress: true
ingress_port: 7100
panel_icon: mdi:airplane
panel_title: Planes
ports:
  7100/tcp: null
ports_description:
  7100/tcp: Dashboard and API for other browsers and the Lovelace card (optional; the sidebar panel works without it)
options:
  source: piaware
  piaware: http://piaware.local
  skyaware_path: /skyaware/
  airport: ""
  ha_webhook: ""
  ntfy_url: ""
schema:
  source: list(piaware|adsb.lol|adsb.fi)
  piaware: str
  radius_nm: int(1,250)?
  skyaware_path: str
  airport: str
  ha_webhook: str
  ntfy_url: str
  ntfy_token: password?
  dashboard_url: str?
  lat: float?
  lon: float?
  military_radius: int(1,250)?
  heli_radius: int(1,100)?
  cooldown_hours: int(1,72)?
  overhead_radius: float(0.5,20)?
  admin_password: password?
  cesium_token: password?
  card_options: str?
