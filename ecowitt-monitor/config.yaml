name: Ecowitt Monitor
version: "1.3.1"
slug: ecowitt_monitor
description: "Ecowitt weather station(s) from Home Assistant's Ecowitt integration: now, graphs up to a year, and alerts (gusts, heavy rain, frost, falling pressure...)."
url: https://github.com/jchisholm59/ecowitt-monitor
arch:
  - aarch64
  - amd64
  - armv7
init: true
startup: application
boot: auto
homeassistant_api: true
ingress: true
ingress_port: 7120
panel_icon: mdi:weather-partly-cloudy
panel_title: Weather
ports:
  7120/tcp: null
ports_description:
  7120/tcp: Dashboard and API for other browsers and the Lovelace card (optional; the sidebar panel works without it)
options:
  station_name: ""
  ha_webhook: ""
  ntfy_url: ""
  stations: []
schema:
  station_name: str
  this_ha: bool?
  station_id: str?
  ha_webhook: str
  ntfy_url: str
  ntfy_token: password?
  dashboard_url: str?
  admin_password: password?
  stations:
    - name: str
      ha_url: url
      ha_token: password
      station_id: str?
  card_options: str?
